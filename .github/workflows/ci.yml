name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR or branch cancels the run it supersedes (saves Actions minutes).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  landing-checks:
    name: Landing checks (biome, tsc, vitest, secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: ./scripts/landing-checks.sh

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" detect --config .gitleaks.toml --redact --source .'

  docker:
    name: Docker build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t 4x35:ci --build-arg COMMIT="${GITHUB_SHA::7}" .
      - name: Smoke (MODE=all answers /healthz)
        run: |
          docker run -d --name ci -e MODE=all -e PORT=8080 -p 18080:8080 4x35:ci
          for i in $(seq 1 20); do curl -fsS localhost:18080/healthz && break; sleep 0.5; done
          curl -fsS localhost:18080/healthz | jq -e '.status=="ok"'
          docker rm -f ci
