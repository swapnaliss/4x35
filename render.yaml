# Render Blueprint for 4x35 (ADR 0016, ADR 0017). Applied by scripts/setup.sh from the main branch.
# One web service and one Postgres database, both in Frankfurt (EU residency, R5).
# No secret value lives in this file: secrets are generated by Render or owner-set (the owner sets the
# value in the Render dashboard, P-22). Plans are pinned here so the hosting cost cannot drift.
services:
  - type: web
    name: 4x35
    runtime: docker
    region: frankfurt
    plan: standard # 1 CPU / 2 GB
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit # every push to main deploys
    # Readiness (select 1 within 2 s, pg-boss started), not liveness: M1-05.
    healthCheckPath: /readyz
    # Migrations run once per deploy, before the new instance takes traffic (M0-06 migrator).
    preDeployCommand: node packages/db/dist/migrate.js
    envVars:
      - key: MODE
        value: all
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # PORT is set by Render; the server reads it.
      - key: DATABASE_URL
        fromDatabase:
          name: 4x35-db
          property: connectionString # internal connection string
      - key: SESSION_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      # Owner-set values (P-22), never in this file. An unset key arrives empty and is ignored.
      - key: APP_BASE_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_DAILY_SPEND_CAP_USD
        sync: false
      - key: LLM_BATCH_TOKEN_CAP
        sync: false

databases:
  - name: 4x35-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "17"
    # Private network only: no external connections to the production database.
    ipAllowList: []
